[package]
name = "ferroliquid_bin"
version = "0.1.0"
edition = "2024"

[lib]
name = "ferroliquid"
crate-type = ["cdylib", "rlib"]

[features]
# Force the app to update at 120Hz and disable vsync, for reduced latency. Hack, for experiments only
default = []

[dependencies]
wasm-bindgen = "0.2"
eframe = { version = "0.32.0", default-features = false, features = [
    "default_fonts", # Embed the default egui fonts.
    "glow", # Use the glow rendering backend. Alternative: "wgpu".
    "persistence", # Enable restoring app state when restarting the app.
] }
egui = { version = "0.32.0" }
egui_extras = { version = "0.32.0", features = ["image"] }
egui_glow = "0.32.0"
glow = "0.16.0"
wasm-bindgen-futures = "0.4"
log = "0.4"
env_logger = "0.11.3"

image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }
itertools = "0.14.0"
bytemuck = { version = "1.23.1", features = ["derive", "extern_crate_alloc"] }
data-encoding = "2.9.0"
smallvec = { version = "1.13.1", features = ["union", "const_generics", "const_new"] }
num-traits = "0.2.19"
anyhow = { version = "1.0.95", features = ["backtrace"] }
web-time = "1.1.0"
rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }
#walkdir = "2.5.0"

# https://github.com/tkaitchuck/aHash/blob/7d5c661a74b12d5bc5448b0b83fdb429190db1a3/compare/readme.md?plain=1#L38C1-L38C152
# If neither `std` or `compile-time-rng` flags are enabled aHash will fall back on using the numeric value of
# memory addresses as a source of randomness.
# Meh good enough, otherwise it's a hassle with WASM
ahash = { version = "0.8.11", default-features = false, features = ["std"] }
web-sys = { version = "0.3.77", features = ["UrlSearchParams"] }
cached = "0.56.0"
# Add "enable" flag to enable tracy-client, causes issues with stacktrace on Windows, see trace_stacktrace_missing.md
tracy-client = { version = "0.18.4", default-features = false, features = ["enable", "system-tracing",
    "context-switch-tracing", "code-transfer", "callstack-inlines", "only-localhost"] }
fastrand = { version = "2.3.0" }
slotmap = { version = "1.0.7", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
snap = "1.1.1"
derive_more = { version = "2.1.1", features = ["from"] }

[profile.release]
debug = true

[profile.test]
debug = true

[profile.dev]
debug = true
